name: macOS Screensaver Build & Smoke Test

on:
  push:
    paths:
      - 'macos-screensaver/**'
      - 'src/lib.rs'
      - 'src/ffi.rs'
      - 'src/renderer.rs'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'macos-screensaver/**'
      - 'src/lib.rs'
      - 'src/ffi.rs'
      - 'src/renderer.rs'
      - 'Cargo.toml'

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test

      - name: Build .saver bundle
        run: ./macos-screensaver/build.sh

      - name: Validate bundle structure
        run: |
          test -f target/macos-screensaver/Fiberlamp.saver/Contents/MacOS/Fiberlamp
          test -f target/macos-screensaver/Fiberlamp.saver/Contents/Info.plist

      - name: Verify codesign
        run: codesign --verify target/macos-screensaver/Fiberlamp.saver

      - name: Check universal binary architectures
        run: lipo -info target/macos-screensaver/Fiberlamp.saver/Contents/MacOS/Fiberlamp

      - name: Smoke test screensaver
        continue-on-error: true
        run: |
          cp -R target/macos-screensaver/Fiberlamp.saver ~/Library/Screen\ Savers/
          /System/Library/CoreServices/ScreenSaverEngine.app/Contents/MacOS/ScreenSaverEngine -background &
          screencapture -x screenshot.png
          screencapture -v -V 8 recording.mov &
          RECORD_PID=$!
          wait $RECORD_PID 2>/dev/null || true
          kill %1 2>/dev/null || true

      - name: Upload .saver artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fiberlamp.saver
          path: target/macos-screensaver/Fiberlamp.saver

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore

      - name: Upload recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording
          path: recording.mov
          if-no-files-found: ignore
