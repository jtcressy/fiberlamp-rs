[workspace]
members = [
    "fiberlamp-core",
    "fiberlamp-bin",
    "fiberlamp-macos",
    "fiberlamp-kde",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
rand = "0.8"
log = "0.4"
pollster = "0.4"
env_logger = "0.11"
