[package]
name = "fiberlamp-rs"
version = "0.1.0"
edition = "2024"
description = "Modern Rust reimplementation of xscreensaver fiberlamp with wgpu"
license = "MIT"

[lib]
name = "fiberlamp"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = []
macos-screensaver = ["raw-window-handle"]

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
raw-window-handle = { version = "0.6", optional = true }
